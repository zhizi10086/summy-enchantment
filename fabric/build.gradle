plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def coreDevcheckEnabled = project.hasProperty('coreDevcheck')
def spearDevcheck = project.hasProperty('spearDevcheck')
def spearOnly = project.hasProperty('spearOnly') || spearDevcheck
def isolatedCompatBuild = project.hasProperty('coreOnly') || spearOnly
def spearJar = file('libs/spear-backport-fabric-1.8.0-1.21.1.jar')
def modmenuJar = file(".gradle/modmenu-${project.modmenu_version}.jar")

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'SELocalMaven'
                url = uri('.gradle/se-local-maven')
            }
        }
        filter {
            includeGroup('org.ow2.asm')
            includeGroup('io.github.llamalad7')
            includeModule('net.fabricmc', 'dev-launch-injector')
            includeModule('net.fabricmc', 'fabric-log4j-util')
            includeModule('net.fabricmc', 'intermediary')
            includeModule('net.fabricmc', 'sponge-mixin')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'HuaweiMappingIO'
                url = 'https://repo.huaweicloud.com/repository/maven/'
            }
        }
        filter {
            includeModule('net.fabricmc', 'mapping-io')
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        client {
            if (project.hasProperty('devcheck') || coreDevcheckEnabled || spearDevcheck) {
                property 'summy_enchantment.devcheck', 'true'
                property 'summy_enchantment.devcheck.mode',
                        project.findProperty('devcheckMode')
                                ?: (spearDevcheck ? 'spear'
                                        : (coreDevcheckEnabled && !project.hasProperty('devcheck') ? 'core' : 'full'))
            }
        }
    }
}

tasks.named('runClient') {
    if (project.hasProperty('devcheck') || coreDevcheckEnabled || spearDevcheck) {
        args '--quickPlaySingleplayer', 'SeDevCheckWorld'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 1.21.1 的映射、Loader 与 Fabric API 使用已验证的稳定本地缓存。
    mappings files(".gradle/se-local/yarn-${project.yarn_mappings}-v2.jar")
    modImplementation files('.gradle/se-local/fabric-loader-0.20.1.jar')
    modCompileOnly fileTree(dir: '.gradle/se-fabric-api-nested', include: '*.jar')
    modRuntimeOnly fileTree(dir: '.gradle/se-fabric-api-nested', include: '*.jar')
    // Fabric API 元 JAR 仅供开发运行；正式依赖仍由 fabric.mod.json 声明，不进入发布产物。
    def fabricApiRuntimeJar = file(".gradle/se-local/fabric-api-${project.fabric_version}.jar")
    if (fabricApiRuntimeJar.isFile()) {
        modRuntimeOnly files(fabricApiRuntimeJar)
    }

    // 编译期 Mixin API；运行时由 Fabric Loader 提供。
    compileOnly('net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7') {
        transitive = false
    }

    // Backported Spears 1.8.0 仅用于编译期校验可选兼容；正式依赖仍由用户自行安装。
    if (!project.hasProperty('coreOnly')) {
        if (!spearJar.isFile()) {
            throw new GradleException("缺少 1.21.1 Spears 编译依赖：${spearJar}")
        }
        modCompileOnly files(spearJar)
        if (spearOnly) {
            modRuntimeOnly files(spearJar)
        }
    }

    // Mod Menu 只在编译期校验配置页入口，运行期保持可选。
    if (!isolatedCompatBuild) {
        if (modmenuJar.isFile()) {
            modCompileOnly files(modmenuJar)
        } else {
            modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
        }
    }
}

if (isolatedCompatBuild) {
    sourceSets.main.java.exclude 'com/summy/enchantment/client/SummyEnchantmentModMenu.java'
    sourceSets.main.java.exclude 'com/summy/enchantment/compat/SummyReliquaryMixinPlugin.java'
    if (project.hasProperty('coreOnly')) {
        sourceSets.main.java.exclude 'com/summy/enchantment/compat/SpearCompat.java'
        sourceSets.main.java.exclude 'com/summy/enchantment/compat/SpearMixinPlugin.java'
        sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SpearPiercingWeaponCompatMixin.java'
        sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SpearKineticWeaponCompatMixin.java'
    }
    if (!coreDevcheckEnabled && !spearDevcheck && !project.hasProperty('devcheck')) {
        sourceSets.main.java.exclude 'com/summy/enchantment/devcheck/**'
    } else if (coreDevcheckEnabled && project.hasProperty('coreOnly')) {
        // 核心自检不引用可选 Spears 类型；矛专项留给完整 devcheck 环境。
        sourceSets.main.java.exclude 'com/summy/enchantment/devcheck/SpearFabricDevCheck.java'
    }
    sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SummyReliquaryShadowDashMixin.java'
    sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SummyReliquaryThrownSpearMixin.java'
}

// KubeJS 上游尚未发布 Fabric 1.21.1 对应版本，保留源码供后续恢复，不进入当前产物。
sourceSets.main.java.exclude 'com/summy/enchantment/compat/kubejs/**'

processResources {
    inputs.property 'version', project.version
    exclude 'kubejs.plugins.txt'

    if (isolatedCompatBuild) {
        exclude 'summy_enchantment.summy_reliquary.mixins.json'
        if (project.hasProperty('coreOnly')) {
            exclude 'summy_enchantment.spears.mixins.json'
        }
    }

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }

    doLast {
        if (!isolatedCompatBuild) {
            return
        }
        def metadataFile = layout.buildDirectory.file('resources/main/fabric.mod.json').get().asFile
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        metadata.entrypoints.remove('modmenu')
        metadata.mixins = metadata.mixins.findAll {
            it == 'summy_enchantment.mixins.json'
                    || (spearOnly && it == 'summy_enchantment.spears.mixins.json')
        }
        metadataFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-AdisableTargetValidator=true')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/enchantment/devcheck/**'
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named('sourcesJar') {
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/enchantment/devcheck/**'
    }
}
