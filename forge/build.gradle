plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.maven_group
def coreDevcheckEnabled = project.hasProperty('coreDevcheck')
def spearDevcheck = project.hasProperty('spearDevcheck')
def kubejsDevcheck = project.hasProperty('kubejsDevcheck')
def spearOnly = project.hasProperty('spearOnly') || spearDevcheck
def kubejsOnly = project.hasProperty('kubejsOnly') || kubejsDevcheck
def isolatedCompatBuild = project.hasProperty('coreOnly') || spearOnly || kubejsOnly
def spearJar = file('libs/spear-backport-neoforge-1.8.0-1.21.1.jar')
def kubejsJar = file('libs/kubejs-neoforge-2101.7.2-build.381.jar')
def rhinoJar = file('libs/rhino-neoforge-2101.2.7-build.81.jar')

if ([project.hasProperty('coreOnly'), spearOnly, kubejsOnly].count { it } > 1) {
    throw new GradleException('coreOnly、spearOnly 和 kubejsOnly 不能同时启用')
}

base {
    archivesName = project.archives_base_name
}

repositories {
    // Gate A 使用的官方 minecraft-dependencies module metadata 回退缓存。
    def seLocalMaven = file('.gradle/se-local-maven')
    if (seLocalMaven.isDirectory()) {
        maven {
            name = 'SELocalMaven'
            url = uri(seLocalMaven)
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'SELocalPinned'
                    url = uri(seLocalMaven)
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                // 只锁定本地实际缓存的精确版本，避免拦截 Minecraft 1.21.1 所需的更高版本。
                includeVersion('com.google.guava', 'guava', '31.1-jre')
                includeVersion('org.apache.logging.log4j', 'log4j-core', '2.8.1')
                includeVersion('org.apache.logging.log4j', 'log4j-core', '2.22.1')
                includeVersion('com.google.code.gson', 'gson', '2.10')
                includeVersion('com.google.code.gson', 'gson', '2.10.1')
                includeVersion('com.mojang', 'logging', '1.1.1')
                includeVersion('org.checkerframework', 'checker-qual', '3.12.0')
                includeVersion('com.google.errorprone', 'error_prone_annotations', '2.11.0')
                includeVersion('com.google.j2objc', 'j2objc-annotations', '1.3')
                includeVersion('commons-io', 'commons-io', '2.11.0')
            }
        }
    }
    maven {
        name = 'NeoForgedForgeCDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'BMCLAPI'
        url = 'https://bmclapi2.bangbang93.com/maven'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    mavenCentral()
}

// 自动注入的旧官方库源当前 DNS 不可用，禁用它后再由 ForgeCDN/BMCLAPI 解析。
repositories.configureEach { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url?.host in ['maven.neoforged.net', 'maven.minecraftforge.net']) {
        repo.content {
            excludeGroupByRegex '.*'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            if (project.hasProperty('devcheck') || coreDevcheckEnabled || spearDevcheck || kubejsDevcheck) {
                systemProperty 'summy_enchantment.devcheck', 'true'
                systemProperty 'summy_enchantment.devcheck.mode',
                        project.findProperty('devcheckMode')
                                ?: (kubejsDevcheck ? 'kubejs'
                                        : (spearDevcheck ? 'spear'
                                        : (coreDevcheckEnabled && !project.hasProperty('devcheck') ? 'core' : 'full'))
                                )
                programArguments.addAll '--quickPlaySingleplayer', 'SeDevCheckWorld'
            }
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // MixinExtras 的注解与处理器实现由 NeoForge 运行时提供，这里只补编译期 API。
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.5"

    // Backported Spears 1.8.0 仅用于编译期校验可选兼容。
    if (!project.hasProperty('coreOnly') && !kubejsOnly) {
        if (!spearJar.isFile()) {
            throw new GradleException("缺少 1.21.1 Spears 编译依赖：${spearJar}")
        }
        compileOnly files(spearJar)
        if (spearOnly) {
            runtimeOnly files(spearJar)
        }
    }

    // KubeJS 2101 API 仅用于编译与本地兼容自检，运行期由用户安装。
    if (!project.hasProperty('coreOnly') && !spearOnly) {
        if (!kubejsJar.isFile() || !rhinoJar.isFile()) {
            throw new GradleException("缺少 1.21.1 KubeJS/Rhino 编译依赖")
        }
        compileOnly files(kubejsJar)
        compileOnly files(rhinoJar)
        if (kubejsOnly) {
            runtimeOnly files(kubejsJar)
            runtimeOnly files(rhinoJar)
        }
    }
}

if (isolatedCompatBuild) {
    if (!kubejsOnly) {
        sourceSets.main.java.exclude 'com/summy/enchantment/compat/kubejs/**'
    }
    if (project.hasProperty('coreOnly') || kubejsOnly) {
        sourceSets.main.java.exclude 'com/summy/enchantment/compat/SpearCompat.java'
        sourceSets.main.java.exclude 'com/summy/enchantment/compat/SpearMixinPlugin.java'
        sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SpearPiercingWeaponCompatMixin.java'
        sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SpearKineticWeaponCompatMixin.java'
    }
    if (!coreDevcheckEnabled && !spearDevcheck && !kubejsDevcheck && !project.hasProperty('devcheck')) {
        sourceSets.main.java.exclude 'com/summy/enchantment/devcheck/**'
    } else if ((coreDevcheckEnabled && project.hasProperty('coreOnly')) || kubejsDevcheck) {
        // 核心与 KubeJS 自检不引用可选 Spears 类型；矛专项留给完整 devcheck 环境。
        sourceSets.main.java.exclude 'com/summy/enchantment/devcheck/SpearForgeDevCheck.java'
    }
    sourceSets.main.java.exclude 'com/summy/enchantment/compat/SummyReliquaryMixinPlugin.java'
    sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SummyReliquaryShadowDashMixin.java'
    sourceSets.main.java.exclude 'com/summy/enchantment/mixin/SummyReliquaryThrownSpearMixin.java'
}

processResources {
    inputs.property 'version', project.mod_version

    if (isolatedCompatBuild) {
        if (!kubejsOnly) {
            exclude 'kubejs.plugins.txt'
        }
        exclude 'summy_enchantment.summy_reliquary.mixins.json'
        if (project.hasProperty('coreOnly') || kubejsOnly) {
            exclude 'summy_enchantment.spears.mixins.json'
        }
    }

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.mod_version
    }

    doLast {
        if (!isolatedCompatBuild) {
            return
        }
        // 隔离构建不包含未启用的可选兼容类，元数据必须同步移除对应 Mixin 配置。
        def metadataFile = layout.buildDirectory
                .file('resources/main/META-INF/neoforge.mods.toml').get().asFile
        def metadata = metadataFile.getText('UTF-8').replace('\r\n', '\n')
        def excludedConfigs = project.hasProperty('coreOnly') || kubejsOnly
                ? ['summy_enchantment.spears.mixins.json',
                   'summy_enchantment.summy_reliquary.mixins.json']
                : ['summy_enchantment.summy_reliquary.mixins.json']
        excludedConfigs.each { configName ->
            metadata = metadata.replace(
                    "[[mixins]]\nconfig = \"${configName}\"\n\n", '')
        }
        metadataFile.setText(metadata, 'UTF-8')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/enchantment/devcheck/**'
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : project.archives_base_name,
                'Specification-Vendor'  : 'Summy',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : 'Summy'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
